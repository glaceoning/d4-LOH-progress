<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lord of Hatred Progress Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Diablo IV: Lord of Hatred</h1>
      <p class="subtitle">Spoiler-Free Campaign Progress Tracker</p>
    </header>

    <section class="panel controls">
      <h2>Current Position</h2>
      <div class="grid nav-grid">
        <fieldset class="nav-fieldset">
          <legend>Chapter</legend>
          <div class="nav-row">
            <button id="chapterDownBtn" class="nav-arrow" aria-label="Previous chapter" title="Previous chapter">↓</button>
            <select id="chapterSelect"></select>
            <button id="chapterUpBtn" class="nav-arrow" aria-label="Next chapter" title="Next chapter">↑</button>
          </div>
        </fieldset>
        <fieldset class="nav-fieldset">
          <legend>Quest</legend>
          <div class="nav-row">
            <button id="questDownBtn" class="nav-arrow" aria-label="Previous quest" title="Previous quest">↓</button>
            <select id="questSelect" disabled></select>
            <button id="questUpBtn" class="nav-arrow" aria-label="Next quest" title="Next quest">↑</button>
          </div>
        </fieldset>
        <fieldset class="nav-fieldset">
          <legend>Step</legend>
          <div class="nav-row">
            <button id="stepDownBtn" class="nav-arrow" aria-label="Previous step" title="Previous step">↓</button>
            <select id="stepSelect" disabled></select>
            <button id="stepUpBtn" class="nav-arrow" aria-label="Next step" title="Next step">↑</button>
          </div>
        </fieldset>
      </div>
      <div class="actions">
        <button id="startSessionBtn">Start Play Session Here</button>
        <button id="updateProgressBtn" class="secondary" disabled>Update Current Progress</button>
      </div>
      <p id="sessionStartText" class="session-note">Session not started yet.</p>
    </section>

    <section class="panel">
      <h2>Progress to Milestones</h2>
      <div id="cards" class="cards"></div>
    </section>
  </main>

  <template id="cardTemplate">
    <article class="milestone-card">
      <h3 class="milestone-title"></h3>
      <div class="bars">
        <div>
          <div class="label-row"><span>Session Progress</span><span class="session-text"></span></div>
          <div class="bar-shell"><div class="bar-fill session-fill"></div></div>
        </div>
        <div>
          <div class="label-row"><span>Total Progress</span><span class="total-text"></span></div>
          <div class="bar-shell"><div class="bar-fill total-fill"></div></div>
        </div>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
